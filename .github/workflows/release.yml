name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test

      - name: Check tag matches manifest version
        run: |
          manifest_version=$(jq -r .version manifest.json)
          tag_version=${GITHUB_REF_NAME#v}
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $manifest_version"
            exit 1
          fi

      - name: Package and lint
        run: npm run lint

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/chrome.zip dist/firefox.zip --generate-notes

  chrome:
    needs: build
    if: vars.CHROME_EXTENSION_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: dist

      - name: Upload and publish to Chrome Web Store
        env:
          EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: npx --yes chrome-webstore-upload-cli@3 --source dist/chrome.zip

  edge:
    needs: build
    if: vars.EDGE_PRODUCT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: dist

      - name: Upload and publish to Microsoft Edge Add-ons
        env:
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: .github/scripts/publish-edge.sh dist/chrome.zip "Release $GITHUB_REF_NAME"

  firefox:
    needs: build
    if: vars.AMO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Submit to Firefox Add-ons (AMO)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx --yes web-ext@8 sign --source-dir dist/firefox --artifacts-dir dist/amo --channel listed
